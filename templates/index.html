<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub: Chat & Voice</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --glass-bg: rgba(255,255,255,0.07);
            --glass-border: rgba(255,255,255,0.15);
            --glass-bg-strong: rgba(255,255,255,0.12);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --accent-cyan: #00e5ff;
            --accent-violet: #b36bff;
            --accent-green: #00ffb2;
            --text-primary: rgba(255,255,255,0.95);
            --text-secondary: rgba(255,255,255,0.55);
            --text-muted: rgba(255,255,255,0.3);
            --user-bubble: linear-gradient(135deg, rgba(0,229,255,0.25), rgba(179,107,255,0.2));
            --ai-bubble: rgba(255,255,255,0.06);
            --blur: blur(18px);
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        html, body {
            min-height: 100vh;
            font-family: var(--font-body);
            background: #06080f;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ---- Animated mesh background ---- */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0,229,255,0.10) 0%, transparent 60%),
                radial-gradient(ellipse 70% 55% at 85% 75%, rgba(179,107,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 55% 50%, rgba(0,255,178,0.06) 0%, transparent 60%);
            animation: meshShift 14s ease-in-out infinite alternate;
        }

        @keyframes meshShift {
            0%   { filter: hue-rotate(0deg) brightness(1); }
            100% { filter: hue-rotate(25deg) brightness(1.15); }
        }

        /* ---- Floating orbs ---- */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; z-index: 0;
            animation: orbDrift linear infinite;
        }
        .orb-1 { width: 420px; height: 420px; background: rgba(0,229,255,0.08); top: -100px; left: -100px; animation-duration: 22s; }
        .orb-2 { width: 350px; height: 350px; background: rgba(179,107,255,0.1); bottom: -80px; right: -80px; animation-duration: 18s; animation-direction: reverse; }
        .orb-3 { width: 200px; height: 200px; background: rgba(0,255,178,0.07); top: 45%; left: 65%; animation-duration: 26s; }

        @keyframes orbDrift {
            0%   { transform: translate(0,0) scale(1); }
            33%  { transform: translate(30px,-40px) scale(1.05); }
            66%  { transform: translate(-20px,25px) scale(0.95); }
            100% { transform: translate(0,0) scale(1); }
        }

        /* ---- Page layout ---- */
        .page {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px 16px;
        }

        /* ---- Main card ---- */
        .card {
            width: 100%; max-width: 620px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.12);
            overflow: hidden;
            animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---- Header ---- */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 22px 26px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .logo-ring {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 16px rgba(0,229,255,0.3);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 16px rgba(0,229,255,0.3); }
            50%       { box-shadow: 0 0 28px rgba(179,107,255,0.5); }
        }

        .logo-ring svg { width: 20px; height: 20px; fill: #fff; }

        .header-title {
            font-family: var(--font-display);
            font-size: 18px; font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, #fff 30%, rgba(255,255,255,0.55));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 11px; font-weight: 400;
            color: var(--text-muted); letter-spacing: 0.4px;
            margin-top: 1px;
        }

        /* Status pill */
        .status-pill {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 14px;
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            font-family: var(--font-body);
            font-size: 11px; font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            transition: color 0.3s, border-color 0.3s;
        }

        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            flex-shrink: 0;
            animation: dotBlink 2.5s ease-in-out infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        .status-pill.thinking .status-dot { background: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan); animation: dotSpin 1s linear infinite; }
        .status-pill.listening .status-dot { background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
        .status-pill.speaking .status-dot { background: var(--accent-violet); box-shadow: 0 0 8px var(--accent-violet); }

        @keyframes dotSpin {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.6); }
            100% { transform: scale(1); }
        }

        /* ---- Chat area ---- */
        .chat-box {
            height: 340px; overflow-y: auto;
            padding: 20px 22px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

        /* Empty state */
        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            color: var(--text-muted); text-align: center;
            padding: 30px;
            animation: fadeIn 0.6s ease;
        }

        .empty-icon {
            width: 52px; height: 52px; border-radius: 16px;
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 4px;
        }

        .empty-icon svg { width: 24px; height: 24px; opacity: 0.45; }

        .empty-state p { font-size: 13px; line-height: 1.5; max-width: 220px; }

        /* Message bubbles */
        .message {
            max-width: 80%; padding: 11px 15px;
            border-radius: 18px;
            font-size: 14px; line-height: 1.55;
            animation: bubbleIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
            position: relative;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(10px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border: 1px solid rgba(0,229,255,0.2);
            border-bottom-right-radius: 5px;
            color: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid rgba(255,255,255,0.09);
            border-bottom-left-radius: 5px;
            color: rgba(255,255,255,0.82);
            backdrop-filter: blur(8px);
        }

        /* Typing indicator */
        .typing-indicator {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px; border-bottom-left-radius: 5px;
            padding: 14px 18px;
            display: flex; gap: 5px; align-items: center;
            animation: bubbleIn 0.35s ease both;
        }

        .typing-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.4);
            animation: typingBounce 1.2s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40%            { transform: translateY(-5px); opacity: 1; }
        }

        /* ---- Divider ---- */
        .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0; }

        /* ---- Input zone ---- */
        .input-zone {
            padding: 18px 22px;
            display: flex; gap: 10px; align-items: flex-end;
            background: rgba(0,0,0,0.15);
        }

        .input-wrap {
            flex: 1; position: relative;
        }

        .input-field {
            width: 100%; padding: 13px 16px;
            background: var(--glass-bg-strong);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            resize: none;
        }

        .input-field::placeholder { color: var(--text-muted); }

        .input-field:focus {
            border-color: rgba(0,229,255,0.35);
            box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
        }

        /* Action buttons */
        .btn {
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500; font-size: 13px;
            border-radius: 14px;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
            flex-shrink: 0;
            position: relative; overflow: hidden;
        }

        .btn:active { transform: scale(0.95); }

        .btn::after {
            content: '';
            position: absolute; inset: 0; border-radius: inherit;
            background: rgba(255,255,255,0); 
            transition: background 0.2s;
        }

        .btn:hover::after { background: rgba(255,255,255,0.08); }

        .btn-send {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--accent-cyan), #007fff);
            color: #00080f;
            box-shadow: 0 4px 18px rgba(0,229,255,0.3);
        }

        .btn-send:hover { box-shadow: 0 6px 24px rgba(0,229,255,0.45); }

        .btn-send svg { width: 18px; height: 18px; }

        .btn-voice {
            width: 46px; height: 46px;
            background: var(--glass-bg-strong);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-primary);
            box-shadow: none;
        }

        .btn-voice.active {
            background: linear-gradient(135deg, #ff4d6d, #c2185b);
            border-color: transparent;
            box-shadow: 0 4px 18px rgba(255,77,109,0.4);
            animation: voicePulse 1.1s ease-in-out infinite;
        }

        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 4px 18px rgba(255,77,109,0.4); }
            50%       { box-shadow: 0 4px 32px rgba(255,77,109,0.7); }
        }

        .btn-voice svg { width: 18px; height: 18px; }

        /* ---- Footer hint ---- */
        .footer-hint {
            padding: 10px 22px 16px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(0,0,0,0.15);
        }

        .model-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(179,107,255,0.1);
            border: 1px solid rgba(179,107,255,0.2);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11px; font-weight: 500;
            color: rgba(179,107,255,0.85);
            letter-spacing: 0.2px;
        }

        .hint-sep { color: var(--text-muted); font-size: 11px; }

        .hint-text { font-size: 11px; color: var(--text-muted); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="page">
        <div class="card">

            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <div class="logo-ring">
                        <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 0 2h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1 0-2h1a7 7 0 0 1 7-7h1V5.72A2 2 0 0 1 10 4a2 2 0 0 1 2-2zm0 7a5 5 0 0 0-5 5v3h10v-3a5 5 0 0 0-5-5z"/></svg>
                    </div>
                    <div>
                        <div class="header-title">AI Local Hub</div>
                        <div class="header-subtitle">Chat & Voice Interface</div>
                    </div>
                </div>
                <div class="status-pill" id="statusPill">
                    <div class="status-dot"></div>
                    <span id="statusText">Ready</span>
                </div>
            </div>

            <!-- Chat box -->
            <div class="chat-box" id="chatBox">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    </div>
                    <p>Start a conversation or use voice input to chat with your local AI.</p>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Input zone -->
            <div class="input-zone">
                <div class="input-wrap">
                    <input
                        class="input-field"
                        type="text"
                        id="userInput"
                        placeholder="Ask anything…"
                        autocomplete="off"
                    >
                </div>
                <button class="btn btn-voice" id="voiceBtn" title="Voice input">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3"/>
                        <path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/>
                    </svg>
                </button>
                <button class="btn btn-send" id="sendBtn" title="Send message" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>

            <!-- Footer -->
            <div class="footer-hint">
                <span class="model-tag">
                    <svg width="9" height="9" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="4"/></svg>
                    llama3.1:8b
                </span>
                <span class="hint-sep">·</span>
                <span class="hint-text">Enter to send &nbsp;·&nbsp; 🎤 for voice</span>
            </div>

        </div>
    </div>

    <script>
        const chatBox   = document.getElementById('chatBox');
        const statusPill= document.getElementById('statusPill');
        const statusTxt = document.getElementById('statusText');
        const userInput = document.getElementById('userInput');
        const voiceBtn  = document.getElementById('voiceBtn');
        const emptyState= document.getElementById('emptyState');

        /* ---- Status helper ---- */
        function setStatus(label, mode = 'default') {
            statusTxt.textContent = label;
            statusPill.className = 'status-pill' + (mode !== 'default' ? ' ' + mode : '');
        }

        /* ---- Typing indicator ---- */
        let typingEl = null;
        function showTyping() {
            typingEl = document.createElement('div');
            typingEl.className = 'typing-indicator';
            typingEl.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatBox.appendChild(typingEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function removeTyping() {
            if (typingEl) { typingEl.remove(); typingEl = null; }
        }

        /* ---- Append message ---- */
        function appendMessage(sender, text) {
            if (emptyState) emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* ---- WebSocket ---- */
        const chatSocket = new WebSocket('ws://' + window.location.host + '/ws/chat/');

        chatSocket.onopen = () => setStatus('Connected');
        chatSocket.onclose = () => setStatus('Disconnected', 'error');
        let aiMessageElement = null;
        chatSocket.onmessage = (e) => {
            const data = JSON.parse(e.data);
            
            if (data.error) {
                removeTyping();
                appendMessage('ai', `Error: ${data.error}`);
                setStatus('Error', 'error');
                return;
            }

            if (!aiMessageElement) {
                // First chunk, create the element
                removeTyping();
                aiMessageElement = document.createElement('div');
                aiMessageElement.className = 'message ai';
                chatBox.appendChild(aiMessageElement);
            }
            
            aiMessageElement.textContent += data.reply;
            chatBox.scrollTop = chatBox.scrollHeight;

            // This is a simple way to detect the end of a stream.
            // You might need a more robust method depending on your backend.
            if (data.reply.endsWith('.') || data.reply.endsWith('!') || data.reply.endsWith('?')) {
                 aiMessageElement = null;
                 setStatus('Ready');
            }
        };

        function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;
            appendMessage('user', msg);
            chatSocket.send(JSON.stringify({ message: msg, model: 'llama3.1:8b' }));
            userInput.value = '';
            showTyping();
            setStatus('Thinking…', 'thinking');
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        /* ---- Voice ---- */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.classList.add('active');
                setStatus('Listening…', 'listening');
            });

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                voiceBtn.classList.remove('active');
                setStatus('Processing…', 'thinking');
                appendMessage('user', transcript);
                showTyping();
                try {
                    const response = await fetch('/api/voice/process-voice/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({ message: transcript, model: 'llama3.1:8b' })
                    });
                    const data = await response.json();
                    removeTyping();
                    appendMessage('ai', data.reply);
                    speak(data.reply);
                } catch {
                    removeTyping();
                    setStatus('Voice error');
                }
            };

            recognition.onerror = () => {
                voiceBtn.classList.remove('active');
                setStatus('Ready');
            };
        } else {
            voiceBtn.disabled = true;
            voiceBtn.style.opacity = '0.35';
            voiceBtn.title = 'Speech recognition not supported';
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
            setStatus('Speaking…', 'speaking');
            utterance.onend = () => setStatus('Ready');
        }
    </script>
</body>
</html>
